name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    # Every action is pinned to a commit: this job holds the key that signs
    # the updates every installed app accepts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # src-tauri/Cargo.toml holds the one version number; a tag naming
      # another would publish installers that call themselves something else.
      - name: The tag names the version being built
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The version comes from src-tauri/rust-toolchain.toml; macOS builds both architectures.
      - name: Rust toolchain
        working-directory: src-tauri
        shell: bash
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Rust keeps source paths inside release binaries; replace the build
      # machine's home and checkout with fixed names (scripts/hide-paths.sh,
      # which scripts/release-local.sh uses too).
      - name: Keep build machine paths out of the binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            home="$(cygpath -w "$USERPROFILE")"; workspace="$(cygpath -w "$GITHUB_WORKSPACE")"
          else
            home="$HOME"; workspace="$GITHUB_WORKSPACE"
          fi
          echo "BUILD_HOME=$home" >> "$GITHUB_ENV"
          echo "BUILD_CHECKOUT=$workspace" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$(sh scripts/hide-paths.sh flags "$home" "$workspace")" >> "$GITHUB_ENV"
      # The updater artifacts are signed with the key the installed apps
      # trust (its public half is in tauri.conf.json); tauri-action also
      # writes latest.json, which the apps read from the latest release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('dockerNanny {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
      - name: No build machine paths are left in the binaries
        shell: bash
        run: |
          binaries="$(find src-tauri/target -maxdepth 3 -type f -path '*/release/*' \( -name dockernanny -o -name dockernanny.exe \))"
          sh scripts/hide-paths.sh check "$BUILD_HOME" "$BUILD_CHECKOUT" $binaries
      - name: Keep the bundles as workflow artifacts too
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockernanny-${{ matrix.platform }}${{ matrix.args && '-' || '' }}${{ matrix.args }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: ignore
