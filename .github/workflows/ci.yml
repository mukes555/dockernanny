name: ci

# Every pull request, and main after each merge (which also keeps the
# caches warm for the next pull request): lint, format, build, tests and
# clippy on all three systems, the advisories of every dependency, and on
# Linux the whole core path end to end against a local sshd.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The version and components come from src-tauri/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Formatting
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pnpm format:check
          cd src-tauri && cargo fmt --check
      # tsc runs inside the build.
      - run: pnpm build
      - name: App tests and lints
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: A local sshd for the smoke test
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y openssh-server rsync
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && chmod go-w ~
          ssh-keygen -t ed25519 -N '' -q -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new 127.0.0.1 'docker compose version'
      - name: Smoke test (machine check, stack, copy there and back)
        if: matrix.os == 'ubuntu-22.04'
        run: sh scripts/smoke-local.sh

  advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
