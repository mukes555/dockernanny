name: ci

# Every pull request, and main after each merge (which also keeps the
# caches warm for the next pull request): lint, format, build, tests and
# clippy on all three systems, the advisories of every dependency, and on
# Linux the whole core path end to end against a local sshd.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The version and components come from src-tauri/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Formatting
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pnpm format:check
          cd src-tauri && cargo fmt --check
      # tsc runs inside the build.
      - run: pnpm build
      - name: App tests and lints
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: A local sshd for the smoke test
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y openssh-server rsync
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && chmod go-w ~
          ssh-keygen -t ed25519 -N '' -q -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new 127.0.0.1 'docker compose version'
      - name: Smoke test (machine check, stack, copy there and back)
        if: matrix.os == 'ubuntu-22.04'
        run: sh scripts/smoke-local.sh

  advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
