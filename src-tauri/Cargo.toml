[package]
name = "dockernanny"
version = "0.7.0"
description = "Run your compose stacks on another machine and keep using localhost"
authors = ["dockerNanny contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "dockernanny_lib"
# Only what main.rs and the examples link. The staticlib and cdylib in
# Tauri's template are for iOS and Android, and linking them costs every build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# GUI apps on macOS do not inherit the shell PATH, so Homebrew's docker, ssh
# and rsync would be invisible when launched from Finder. Pinned to a commit:
# it is not on crates.io, and it runs a login shell at every start.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
notify = "8.2.0"
tauri-plugin-clipboard-manager = "2.3.3"
# The sharing role: one instance, a tray icon, start at login, a random pairing code.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
getrandom = "0.4"
# Reads the tar `docker cp` writes, so listing a local container folder needs no Unix tools.
tar = { version = "0.4", default-features = false }
# Updates from the GitHub release: signed, checked by the app every hour, installed when the user says so.
tauri-plugin-updater = "2"
# The updater's own HTTP client, given a connect timeout (updates.rs); the same crate the updater uses.
reqwest = { version = "0.13", default-features = false }
if-addrs = "0.15"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
# A test builds its own HTTP client, which needs the crypto provider the updater installs for its own.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# The elevated helper (UAC relaunch) and its token check; the job object that ends children with the app.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 2
panic = "abort"
strip = true
