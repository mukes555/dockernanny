[package]
name = "dockernanny"
version = "0.3.1"
description = "Run your compose stacks on another machine and keep using localhost"
authors = ["dockerNanny contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "dockernanny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# GUI apps on macOS do not inherit the shell PATH, so Homebrew's docker, ssh
# and rsync would be invisible when launched from Finder.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
notify = "8.2.0"
tauri-plugin-clipboard-manager = "2.3.3"
# The sharing role: one instance, a tray icon, start at login, a random pairing code.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
getrandom = "0.3"
# Updates from the GitHub release: signed, checked on start, installed when the user says so.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# The elevated helper (UAC relaunch) and its token check.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 2
panic = "abort"
strip = true
